version: '3.8'

services:
  # Servicio de Base de Datos PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: msms_db
    restart: always
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: msms_db
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

  # Servicio Backend NestJS
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: msms_api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # Conecta a la base de datos de arriba. 
      # Usamos el nombre del servicio (db) como host.
      - DATABASE_URL=postgresql://user:password@db:5432/msms_db?schema=public
      - NODE_ENV=production
    depends_on:
      - db

volumes:
  db_data:
