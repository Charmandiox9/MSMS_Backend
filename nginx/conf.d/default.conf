resolver 127.0.0.11 valid=10s ipv6=off;
upstream backend {
    zone backend 64k;
    server api:3001 resolve;
}
upstream web {
    zone web 64k;
    server frontend:3001 resolve;
}
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
log_format private '$remote_addr $request_method $uri $status $body_bytes_sent';

server {
    listen 80;
    server_name _;
    server_tokens off;
    access_log /var/log/nginx/access.log private;
    client_max_body_size 1m;
    limit_req_status 429;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_vary on;
    gzip_types text/css application/json application/javascript image/svg+xml;

    location = /api/runtime-config { proxy_pass http://web; }
    location = /api { proxy_pass http://backend; }
    location = /api/storage/files/upload {
        client_max_body_size 10m;
        proxy_request_buffering off;
        proxy_pass http://backend;
    }
    location = /api/storage/files/download {
        proxy_buffering off;
        proxy_pass http://backend;
    }
    location ~ ^/api/academic/(teachers/import-(csv|roster)|courses/import-csv)$ {
        client_max_body_size 100m;
        proxy_pass http://backend;
    }
    location = /api/academic/students/import-csv {
        client_max_body_size 8m;
        proxy_pass http://backend;
    }
    location /api/academic/imports/ {
        client_max_body_size 18m;
        proxy_pass http://backend;
    }
    location /api/ {
        limit_req zone=api_limit burst=40 nodelay;
        proxy_pass http://backend;
    }
    location / {
        proxy_buffering off;
        proxy_pass http://web;
    }
}
