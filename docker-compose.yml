version: '3.8'

services:
  # Servicio de Base de Datos PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: msms_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-msms_db}
    # No exponemos el puerto al host para no chocar con tu entorno de desarrollo local.
    volumes:
      - db_data:/var/lib/postgresql/data

  # Servicio Backend NestJS
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: msms_api
    restart: unless-stopped
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - NODE_ENV=${NODE_ENV:-preproduction}
    depends_on:
      - db

  # Servicio Frontend Next.js
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: msms_frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=${NODE_ENV:-preproduction}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-/graphql}
      - NEXT_PUBLIC_STORAGE_URL=${NEXT_PUBLIC_STORAGE_URL:-/storage}
    depends_on:
      - api

  # Caché: Redis (Pre-producción / Producción)
  redis:
    image: redis:7-alpine
    container_name: msms_redis
    restart: always
    volumes:
      - redis_data:/data

  # Almacenamiento de objetos: MinIO (Pre-producción / Producción)
  minio:
    image: minio/minio
    container_name: msms_minio
    restart: always
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  # Proxy Inverso: NGINX (Punto de entrada único)
  nginx:
    image: nginx:alpine
    container_name: msms_nginx
    restart: always
    ports:
      # Exponemos NGINX en el puerto 8080 del host para no chocar con nada en desarrollo
      - "${NGINX_HTTP_PORT:-8080}:80"
      - "${NGINX_HTTPS_PORT:-8443}:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - api
      - frontend
      - minio

volumes:
  db_data:
  redis_data:
  minio_data:
