# ==========================================
# Configuración de Zonas de Rate Limiting
# ==========================================
# api_limit: Permite 10 peticiones por segundo.
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

# front_limit: Permite 20 peticiones por segundo (más holgado para cargar assets html/css/js).
limit_req_zone $binary_remote_addr zone=front_limit:10m rate=20r/s;

server {
    listen 80;
    server_name localhost; # En producción, cambia esto por tu dominio (ej. msms.edu.cl)

    # 1. Seguridad Básica
    server_tokens off; # Oculta la versión de Nginx
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always; # Descomentar cuando tengas HTTPS

    # 2. Compresión GZIP (Mejora tiempos de carga)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # 3. Reglas de Ruteo

    # A) BACKEND: API GraphQL
    location /graphql {
        # Aplica Rate Limit: Si llegan más de 10 r/s, encola hasta 20 (burst) sin demora extra. Las sobrantes dan Error 503.
        limit_req zone=api_limit burst=20 nodelay;
        
        proxy_pass http://api:3000/graphql;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade; # Soporte para WebSockets (Subscriptions de GraphQL)
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        
        # Headers para que NestJS sepa la IP real del cliente
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # B) ALMACENAMIENTO: MinIO (Proxy para servir archivos)
    location /storage/ {
        # Reescribe /storage/mi-archivo a /mi-archivo en minio
        rewrite ^/storage/(.*) /$1 break;
        
        proxy_pass http://minio:9000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Tamaño máximo de subida de archivos (ej. 50 MB)
        client_max_body_size 50M;
    }

    # C) FRONTEND: Next.js (Ruta por defecto)
    location / {
        limit_req zone=front_limit burst=50 nodelay;
        
        proxy_pass http://frontend:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade; # Vital para el HMR (Hot Reload) de Next.js
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
